[workspace]
resolver = "3"
members = ["crates/core", "crates/term", "crates/tui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/s5suzuki/twit"
publish = false

[workspace.dependencies]
alacritty_terminal = "0.26.0"
git2 = { version = "0.21.0", features = ["ssh", "https"] }
ignore = "0.4.35"
notify-debouncer-mini = "0.7.0"
portable-pty = "0.9.0"
ratatui = "0.30.2"
regex = "1.13.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
toml = "1.2.3"
toml_edit = { version = "0.25.21", default-features = false, features = ["parse", "display"] }
two-face = { version = "0.5.2", default-features = false, features = ["syntect-fancy"] }
unicode-width = "0.2.3"
twit-core = { path = "crates/core", default-features = false }
twit-term = { path = "crates/term" }
