[package]
name = "xtask"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
anyhow = { version = "1.0.104", default-features = false, features = ["std"] }
clap = { version = "4.6.7", default-features = false, features = [
    "std",
    "derive",
    "help",
    "usage",
    "error-context",
] }

[workspace]

[lints.rust]
warnings = "deny"
unreachable_pub = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
